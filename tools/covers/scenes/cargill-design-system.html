<script>
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e;}
// tint ramps under each theme column
const ramps=document.getElementById('ramps');
const mix=(a,b,t)=>{const h=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16));const A=h(a),B=h(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');};
[[110,'#00430F','#00843D'],[257,'#055B49','#279989'],[404,'#003641','#007582']].forEach(([x,d,c])=>{
  const cells=[d,mix(d,c,.5),c,mix(c,'#ffffff',.18),mix(c,'#ffffff',.36),mix(c,'#ffffff',.54),mix(c,'#ffffff',.72),mix(c,'#ffffff',.88)];
  cells.forEach((col,i)=>el('rect',{x:x+i*17,y:352,width:17,height:30,fill:col},ramps));
});
// variant row
const v=document.getElementById('variants');
const types=[['#00843D','#fff',null],['#4C4C4C','#fff',null],['#E6E6E6','#1A1A1A',null],['#fff','#1A1A1A','#4C4C4C'],[null,'#1A1A1A',null]];
types.forEach(([fill,fg,stroke],i)=>{
  const x=700+i*160,y=522;
  if(fill)el('rect',{x,y,width:130,height:46,rx:4,fill,stroke:stroke||'none','stroke-width':2},v);
  const g=el('g',{transform:`translate(${x+16} ${y+11}) scale(1)`,fill:fg},v);el('use',{href:'#i-down'},g);
  el('rect',{x:x+48,y:y+18,width:62,height:10,rx:5,fill:fg},v);
  el('rect',{x:x+30,y:y+60,width:70,height:8,rx:4,fill:'#D6D6D6'},v);
});
// states row
const s=document.getElementById('states');
const st=[['#00843D',null],['#006A31',null],['#00843D','#99CEB1'],['#00430F',null],['#CCCCCC',null]];
st.forEach(([fill,ring],i)=>{
  const x=700+i*160,y=618;
  if(ring)el('rect',{x:x-5,y:y-5,width:140,height:56,rx:8,fill:'none',stroke:ring,'stroke-width':3},s);
  el('rect',{x,y,width:130,height:46,rx:4,fill},s);
  const g=el('g',{transform:`translate(${x+16} ${y+11})`,fill:i==4?'#8C8C8C':'#fff'},s);el('use',{href:'#i-down'},g);
  el('rect',{x:x+48,y:y+18,width:62,height:10,rx:5,fill:i==4?'#8C8C8C':'#fff'},s);
  el('rect',{x:x+30,y:y+60,width:70,height:8,rx:4,fill:'#D6D6D6'},s);
});
</script>
